<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1C1E24" stroke-width="0.9"/>
    </pattern>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 800; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 400; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Two-Tone Minimalist Matte Obsidian Canvas -->
  <rect width="1200" height="310" rx="20" fill="#0A0A0C" stroke="#242730" stroke-width="2"/>
  <rect width="1200" height="310" rx="20" fill="url(#grid)" opacity="0.7"/>

  <!-- Geometric Two-Tone Emblem -->
  <circle cx="178" cy="155" r="78" fill="#121317" stroke="#282B34" stroke-width="2"/>
  <circle cx="178" cy="155" r="78" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="120 380" stroke-linecap="round"/>
  <path d="M136 118 L156 118 L178 174 L200 118 L220 118 L187 198 L169 198 Z" fill="#F4F4F6"/>
  <circle cx="178" cy="116" r="6" fill="#10B981"/>

  <!-- Typography -->
  <text x="302" y="124" font-size="66" fill="#F4F4F6" class="title" letter-spacing="-2">V2Vex</text>
  <rect x="524" y="84" width="240" height="32" rx="8" fill="#121317" stroke="#2A2D37" stroke-width="1.2"/>
  <circle cx="544" cy="100" r="4.5" fill="#10B981"/>
  <text x="652" y="105" font-size="13" fill="#F4F4F6" text-anchor="middle" class="mono">v3.0 · TWO-TONE MINIMALIST</text>

  <text x="304" y="168" font-size="20" fill="#9CA3AF" class="sub">
    99% Fast &amp; Light Android Proxy Flagship · Pure L3 TUN · BugHost Sniper · Modular Dual-Core
  </text>

  <!-- Two-Tone Spec Strip -->
  <g transform="translate(304, 198)">
    <rect x="0" y="0" width="186" height="38" rx="9" fill="#121317" stroke="#262932"/>
    <text x="93" y="24" font-size="13" fill="#F4F4F6" text-anchor="middle" class="mono">PURE L3 TELEMETRY</text>

    <rect x="198" y="0" width="194" height="38" rx="9" fill="#121317" stroke="#262932"/>
    <text x="295" y="24" font-size="13" fill="#F4F4F6" text-anchor="middle" class="mono">BUGHOST SNIPER LAB</text>

    <rect x="404" y="0" width="196" height="38" rx="9" fill="#121317" stroke="#262932"/>
    <text x="502" y="24" font-size="13" fill="#F4F4F6" text-anchor="middle" class="mono">1-CLICK FREE WARP</text>

    <rect x="612" y="0" width="198" height="38" rx="9" fill="#121317" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="711" y="24" font-size="13" fill="#10B981" text-anchor="middle" class="mono">DIAGNOSTIC LOG .TXT</text>
