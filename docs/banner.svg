<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1526"/>
      <stop offset="100%" stop-color="#08121E"/>
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B2840" stroke-width="0.8" opacity="0.45"/>
    </pattern>
    <style>
      .pulse-ring {
        transform-origin: 185px 160px;
        animation: pulse 3.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Background & Cyber Grid -->
  <rect width="1200" height="320" rx="22" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="185" cy="160" r="145" fill="url(#glowCyan)"/>
  <circle cx="1020" cy="70" r="160" fill="url(#glowEmerald)"/>

  <!-- Animated Emblem Ring -->
  <circle class="pulse-ring" cx="185" cy="160" r="88" fill="none" stroke="url(#cyanEmerald)" stroke-width="3" stroke-dasharray="14 8"/>
  <circle cx="185" cy="160" r="72" fill="#0A111F" stroke="#00E5FF" stroke-opacity="0.45" stroke-width="2"/>

  <!-- V2Vex Emblem -->
  <path d="M140 120 L163 120 L185 174 L207 120 L230 120 L195 206 L175 206 Z" fill="#00E5FF"/>
  <path d="M173 120 L185 148 L197 120 Z" fill="#00E676"/>

  <!-- Brand Typography -->
  <text x="315" y="128" font-size="68" fill="#F1F5F9" class="title" letter-spacing="-1.5">V2Vex</text>
  <rect x="548" y="84" width="176" height="34" rx="17" fill="#00E676" fill-opacity="0.14" stroke="#00E676" stroke-opacity="0.65" stroke-width="1.2"/>
  <text x="636" y="106" font-size="14" fill="#00E676" text-anchor="middle" class="mono">99% FAST &amp; LIGHT</text>

  <text x="317" y="172" font-size="22" fill="#94A3B8" class="sub">
    Next-Gen Android V2Ray / Xray Client · Hot-Swappable Core · Precision Mbps SpeedLab
  </text>

  <!-- Feature Pills -->
  <g transform="translate(317, 206)">
    <rect x="0" y="0" width="172" height="38" rx="11" fill="#111C30" stroke="#00E5FF" stroke-opacity="0.4"/>
    <text x="86" y="24" font-size="13.5" fill="#E2E8F0" text-anchor="middle" class="mono">1.3 MB App Core</text>

    <rect x="186" y="0" width="208" height="38" rx="11" fill="#111C30" stroke="#00E676" stroke-opacity="0.4"/>
    <text x="290" y="24" font-size="13.5" fill="#E2E8F0" text-anchor="middle" class="mono">1-Tap Xray Updater</text>

    <rect x="408" y="0" width="212" height="38" rx="11" fill="#111C30" stroke="#7C4DFF" stroke-opacity="0.45"/>
    <text x="514" y="24" font-size="13.5" fill="#E2E8F0" text-anchor="middle" class="mono">Multi-Stream Mbps</text>

    <rect x="634" y="0" width="184" height="38" rx="11" fill="#111C30" stroke="#FFB300" stroke-opacity="0.4"/>
    <text x="726" y="24" font-size="13.5" fill="#E2E8F0" text-anchor="middle" class="mono">DPI Bypass · REALITY</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="314" width="1200" height="6" rx="3" fill="url(#cyanEmerald)"/>
</svg>
