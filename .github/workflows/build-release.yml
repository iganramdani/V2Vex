name: Build & Release V2Vex APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    # Weekly Monday 03:00 UTC check to verify build against latest XTLS/Xray-core
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Bundle Latest Xray-core, hev-socks5-tunnel & GeoData
        run: |
          chmod +x scripts/update-core.sh
          ./scripts/update-core.sh

      - name: Run Unit Tests & Build Release APK
        run: |
          gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Align & Sign Release APK
        env:
          V2VEX_KEYSTORE_B64: ${{ secrets.V2VEX_KEYSTORE_B64 }}
          V2VEX_KEY_ALIAS: ${{ secrets.V2VEX_KEY_ALIAS }}
          V2VEX_STORE_PASS: ${{ secrets.V2VEX_STORE_PASS }}
          V2VEX_KEY_PASS: ${{ secrets.V2VEX_KEY_PASS }}
        run: |
          BUILD_TOOLS="$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)"

          if [[ -n "$V2VEX_KEYSTORE_B64" ]]; then
            echo "$V2VEX_KEYSTORE_B64" | base64 -d > v2vex-release.jks
            ALIAS="${V2VEX_KEY_ALIAS:-v2vex}"
            SPASS="$V2VEX_STORE_PASS"
            KPASS="$V2VEX_KEY_PASS"
          else
            echo "WARN: V2VEX_KEYSTORE_B64 secret not set; generating fallback release keystore"
            keytool -genkeypair -v \
              -keystore v2vex-release.jks -alias v2vex \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass v2vex99release -keypass v2vex99release \
              -dname "CN=V2Vex, OU=Engineering, O=V2Vex, L=Global, S=Global, C=ID"
            ALIAS="v2vex"
            SPASS="v2vex99release"
            KPASS="v2vex99release"
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG_NAME="v1.1.0-ci"
          fi
          APK_NAME="V2Vex-${TAG_NAME}-arm64-v8a-release.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks v2vex-release.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" \
            --key-pass "pass:$KPASS" \
            --out "$APK_NAME" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "CORE_VER=$(cat app/src/main/assets/core_version.txt || echo latest)" >> "$GITHUB_ENV"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2Vex-APK
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${APK_NAME}" \
            --title "V2Vex ${GITHUB_REF_NAME} — Modular Dual-Core · Real-Time Full Log · Precision Speed Meter" \
            --notes "## ⚡ V2Vex ${GITHUB_REF_NAME} — Phase 1–4 Complete

          ### 🔥 What's New in ${GITHUB_REF_NAME}
          - 📊 **Fixed Live & Notification Speed Meter**: Removed \`setHttpProxy\` TUN bypass so 100% of HTTP/HTTPS/UDP/DNS traffic flows through L3 TUN; hybrid \`TProxyGetStats()\` + UID socket stats with EMA smoothing; **1-second live speed right in the notification title** + session totals!
          - 🪵 **Real-Time Full Log Console**: 1-tap \`LIVE LOG\` button on Dashboard, 3000-line 100ms live stream, persistent rolling log file, global crash stacktrace recorder, 1-tap Xray \`debug/info/warning\` hot-reload switch, source/level/search filters, and 1-tap **Copy/Share Full Sanitized Bug Report**.
          - 🧬 **Modular Dual-Core Engine (Phase 4)**: Smart Dual-Core (**Xray-core** + **Sing-box**), **Hysteria2** & **TUIC v5** protocol support, and external Android 10–15 W^X-compliant Core Plugin APK discovery (\`com.v2vex.core.xray\` / \`com.v2vex.core.singbox\`).
          - 🛡️ **Observatory Auto-Failover & Multi-Hop Proxy Chain**: Xray \`observatory\` + \`leastPing\` load balancer across backup nodes + Multi-Hop \`dialerProxy\` chaining.
          - 📱 **QR Code Sharing + Universal Subscription Parser**: ISO-18004 QR Code Generator on every node + import **Clash / Mihomo YAML** & **Sing-box JSON** subscriptions.
          - 🎯 **SpeedLab v2 + Node vs Node Ranking**: Keep-Alive True RTT, Server-ACK Upload, and live Top-3 Node Speed Ranking.

          ### 📦 Included in this APK
          - Official **XTLS/Xray-core \`${CORE_VER}\`** (\`arm64-v8a\`) + native C **\`hev-socks5-tunnel\`** L3 TUN + \`geoip.dat\` & \`geosite.dat\`"
