name: Build & Release V2Vex APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    # Weekly Monday 03:00 UTC check to verify build against latest XTLS/Xray-core
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Bundle Latest Xray-core, hev-socks5-tunnel & GeoData
        run: |
          chmod +x scripts/update-core.sh
          ./scripts/update-core.sh

      - name: Run Unit Tests & Build Release APK
        run: |
          gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Align & Sign Release APK
        env:
          V2VEX_KEYSTORE_B64: ${{ secrets.V2VEX_KEYSTORE_B64 }}
          V2VEX_KEY_ALIAS: ${{ secrets.V2VEX_KEY_ALIAS }}
          V2VEX_STORE_PASS: ${{ secrets.V2VEX_STORE_PASS }}
          V2VEX_KEY_PASS: ${{ secrets.V2VEX_KEY_PASS }}
        run: |
          BUILD_TOOLS="$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)"

          if [[ -n "$V2VEX_KEYSTORE_B64" ]]; then
            echo "$V2VEX_KEYSTORE_B64" | base64 -d > v2vex-release.jks
            ALIAS="${V2VEX_KEY_ALIAS:-v2vex}"
            SPASS="$V2VEX_STORE_PASS"
            KPASS="$V2VEX_KEY_PASS"
          else
            echo "WARN: V2VEX_KEYSTORE_B64 secret not set; generating fallback release keystore"
            keytool -genkeypair -v \
              -keystore v2vex-release.jks -alias v2vex \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass v2vex99release -keypass v2vex99release \
              -dname "CN=V2Vex, OU=Engineering, O=V2Vex, L=Global, S=Global, C=ID"
            ALIAS="v2vex"
            SPASS="v2vex99release"
            KPASS="v2vex99release"
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG_NAME="v3.0.0-ci"
          fi
          APK_NAME="V2Vex-${TAG_NAME}-arm64-v8a-release.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks v2vex-release.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" \
            --key-pass "pass:$KPASS" \
            --out "$APK_NAME" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "CORE_VER=$(cat app/src/main/assets/core_version.txt || echo latest)" >> "$GITHUB_ENV"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2Vex-APK
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${APK_NAME}" \
            --title "V2Vex ${GITHUB_REF_NAME} — Two-Tone Minimalist Flagship" \
            --notes "## ⚪⚫ V2Vex ${GITHUB_REF_NAME} — Two-Tone Minimalist Flagship

          ### 🔥 What's New in ${GITHUB_REF_NAME}
          - ⚪⚫ **Two-Tone Minimalist UX**: Architectural monochrome design (**Obsidian Two-Tone**, **AMOLED Monochrome**, **Paper & Ink**) with tabular monospace numerals and hairline geometry.
          - 📊 **Zero-Loopback Pure L3 Speed Meter + Screen-Off Saver**: Calibrated on real Xiaomi Redmi Note 9 hardware — strictly \`TProxyGetStats()\` + \`SpeedLabTrafficCounter\` (eliminates 2.6x–7.3x Android eBPF loopback inflation) and pauses SystemUI wakeups when screen is locked!
          - 🪵 **Native \`.txt\` Diagnostic Logger + Live Connection Firewall**: Pinned System Logs (never evicted by Xray debug stream) + Engine Logs, **Save \`.txt\` File (SAF)** & **Share \`logV2Vex.txt\` (\`FileProvider\`)**, plus real-time domain monitor with 1-tap \`Block\` / \`Direct\` rules.
          - 🧪 **BugHost / CDN Sniper Studio + Safe SNI Spoofing**: Concurrent TLS SNI + HTTP HEAD CDN scanner + \`verifyPeerCertByName\` certificate pinning (fixes SNI-spoof \`x509\` errors without \`allowInsecure\`!).
          - ☁️ **1-Click Free Cloudflare WARP Generator**: Pure-Kotlin RFC 7748 Curve25519 registration for instant clean-IP WireGuard & Multi-Hop Proxy Chaining.
          - ⚡ **Port-53 \`dns-out\` Hijack · QUIC 443 Guard · NAT64 \`UseIPv4\` Fix · MIUI Battery Saver Helper · Tasker Intents · Open-Source Credits**.

          ### 🙏 Respect & Attribution
          Powered by **XTLS/Xray-core** (\`${CORE_VER}\`), **heiher/hev-socks5-tunnel**, and **Loyalsoldier/v2ray-rules-dat**. Full credits in [CREDITS.md](https://github.com/iganramdani/V2Vex/blob/main/CREDITS.md)."
