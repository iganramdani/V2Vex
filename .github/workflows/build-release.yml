name: Build & Release V2Vex APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    # Weekly Monday 03:00 UTC check to verify build against latest XTLS/Xray-core
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Bundle Latest Xray-core, hev-socks5-tunnel & GeoData
        run: |
          chmod +x scripts/update-core.sh
          ./scripts/update-core.sh

      - name: Run Unit Tests & Build Release APK
        run: |
          gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Align & Sign Release APK
        env:
          V2VEX_KEYSTORE_B64: ${{ secrets.V2VEX_KEYSTORE_B64 }}
          V2VEX_KEY_ALIAS: ${{ secrets.V2VEX_KEY_ALIAS }}
          V2VEX_STORE_PASS: ${{ secrets.V2VEX_STORE_PASS }}
          V2VEX_KEY_PASS: ${{ secrets.V2VEX_KEY_PASS }}
        run: |
          BUILD_TOOLS="$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)"

          if [[ -n "$V2VEX_KEYSTORE_B64" ]]; then
            echo "$V2VEX_KEYSTORE_B64" | base64 -d > v2vex-release.jks
            ALIAS="${V2VEX_KEY_ALIAS:-v2vex}"
            SPASS="$V2VEX_STORE_PASS"
            KPASS="$V2VEX_KEY_PASS"
          else
            echo "WARN: V2VEX_KEYSTORE_B64 secret not set; generating fallback release keystore"
            keytool -genkeypair -v \
              -keystore v2vex-release.jks -alias v2vex \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass v2vex99release -keypass v2vex99release \
              -dname "CN=V2Vex, OU=Engineering, O=V2Vex, L=Global, S=Global, C=ID"
            ALIAS="v2vex"
            SPASS="v2vex99release"
            KPASS="v2vex99release"
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG_NAME="v3.1.0-ci"
          fi
          APK_NAME="V2Vex-${TAG_NAME}-arm64-v8a-release.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks v2vex-release.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" \
            --key-pass "pass:$KPASS" \
            --out "$APK_NAME" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "CORE_VER=$(cat app/src/main/assets/core_version.txt || echo latest)" >> "$GITHUB_ENV"
          echo "SINGBOX_VER=$(cat app/src/main/assets/singbox_version.txt || echo latest)" >> "$GITHUB_ENV"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2Vex-APK
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${APK_NAME}" \
            --title "V2Vex ${GITHUB_REF_NAME} — True Bundled Dual-Core (Xray + Sing-box) & Visual GeoSite Studio" \
            --notes "## ⚪⚫ V2Vex ${GITHUB_REF_NAME} — True Bundled Dual-Core & Visual GeoSite Studio

          ### 🔥 Fixed & Upgraded in ${GITHUB_REF_NAME} (Forensic Audit from Real Device \`logV2Vex.txt\`)
          - 🚀 **Bundled Sing-box Core (\`libsingbox.so\` ${SINGBOX_VER})**: Sing-box now ships directly inside \`jniLibs\` (Android 10–15 W^X compliant, zero external plugin APK needed!) with full **Sing-box 1.12–1.14+ schema** (\`action: sniff\`, \`hijack-dns\`, \`reject\`, typed DoH DNS, QUIC Guard, NAT64 strategy).
          - 🌍 **Visual GeoSite & GeoIP Rule Studio + 1-Tap Quick Packs**: Pure-Kotlin protobuf wire scanner reads ALL real tags directly from \`geosite.dat\` & \`geoip.dat\`! Toggle **Block Ads**, **Direct Indonesia**, **Proxy Streaming**, **Proxy AI & Dev**, or **Proxy Social** in 1 tap, or search & tap tags visually with zero typos.
          - 🛡️ **Zero-Crash Hot-Reload + Automatic Rollback**: Serialized \`Mutex\` lifecycle + 450ms smart settings debounce + generation-guarded process manager completely eliminates exit-code-143/141 race kills and exit-code-23 invalid-tag/fragment crashes — automatically rolling back to the last healthy config if a rule fails!
          - 🪵 **Pinned Fatal Stderr Capture**: Exact Xray / Sing-box startup error lines are now pinned straight into System Logs & exported \`.txt\` reports.

          ### 🙏 Respect & Attribution
          Powered by **XTLS/Xray-core** (\`${CORE_VER}\`), **SagerNet/sing-box** (\`${SINGBOX_VER}\`), **heiher/hev-socks5-tunnel**, and **Loyalsoldier/v2ray-rules-dat**. Full credits in [CREDITS.md](https://github.com/iganramdani/V2Vex/blob/main/CREDITS.md)."
